name: pulse-crm

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - pulse_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: pulse-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8025/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pulse_pgdata:
  pulse_redisdata:
