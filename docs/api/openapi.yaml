openapi: 3.1.0
info:
  title: Pulse CRM API
  version: 0.1.0
  description: |
    Mini Sales CRM for small teams. This contract is the technical source for `/api/v1`.
    Error, pagination, auth and RBAC conventions live in `docs/api-conventions.md`,
    `docs/error-codes.md` and `docs/permissions-matrix.md`.
servers:
  - url: http://localhost:3000/api/v1
    description: Local dev
  - url: https://api.pulse.example/api/v1
    description: Production (placeholder)
tags:
  - name: Auth
  - name: Users
  - name: Contacts
  - name: Pipelines
  - name: Deals
  - name: Activities
  - name: Tasks
  - name: Reports
  - name: Notifications
  - name: Imports
  - name: Webhooks
  - name: Audit
  - name: Exports
  - name: AI
  - name: Health
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      security: []
      responses:
        '200':
          description: DB/Redis ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Organization + Admin created
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated tokens
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204': { description: Logged out, cookie cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: me
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Users in org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Users]
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: ownerId
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: { type: string, maxLength: 50 }
        - name: createdFrom
          in: query
          schema: { type: string, format: date }
        - name: createdTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Contacts (scoped by RBAC)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Contacts]
      operationId: createContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Contacts]
      operationId: getContact
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Contacts]
      operationId: updateContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Contacts]
      operationId: deleteContact
      responses:
        '204': { description: Soft deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /pipelines:
    get:
      tags: [Pipelines]
      operationId: listPipelines
      responses:
        '200':
          description: Pipelines in org
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pipeline'
    post:
      tags: [Pipelines]
      operationId: createPipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineCreate'
      responses:
        '201':
          description: Pipeline created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /pipelines/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Pipelines]
      operationId: updatePipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Pipeline updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Pipelines]
      operationId: deletePipeline
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /pipelines/{id}/stages:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Pipelines]
      operationId: createStage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageCreate'
      responses:
        '201':
          description: Stage created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /stages/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Pipelines]
      operationId: updateStage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageUpdate'
      responses:
        '200':
          description: Stage updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Pipelines]
      operationId: deleteStage
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deals:
    get:
      tags: [Deals]
      operationId: listDeals
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: pipelineId
          in: query
          schema: { type: string, format: uuid }
        - name: stageId
          in: query
          schema: { type: string, format: uuid }
        - name: ownerId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DealStatus' }
      responses:
        '200':
          description: Deals (board/list)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealList'
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Deals]
      operationId: createDeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealCreate'
      responses:
        '201':
          description: Deal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /deals/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Deals]
      operationId: getDeal
      responses:
        '200':
          description: Deal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Deals]
      operationId: updateDeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealUpdate'
      responses:
        '200':
          description: Deal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deals/{id}/move:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Deals]
      operationId: moveDeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealMove'
      responses:
        '200':
          description: Deal moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deals/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Deals]
      operationId: assignDeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealAssign'
      responses:
        '200':
          description: Deal assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deals/{id}/activities:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Activities]
      operationId: listDealActivities
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ActivityType' }
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Activities]
      operationId: createDealActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreate'
      responses:
        '201':
          description: Activity/task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /activities/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Activities]
      operationId: updateActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityUpdate'
      responses:
        '200':
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [open, overdue, done] }
        - name: assigneeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Task projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Tasks]
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/summary:
    get:
      tags: [Reports]
      operationId: reportSummary
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: ownerId
          in: query
          schema: { type: string, format: uuid }
        - name: pipelineId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: unread
          in: query
          schema: { type: boolean }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/NotificationType' }
      responses:
        '200':
          description: Notifications of current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
  /notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      responses:
        '200':
          description: Marked read (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      responses:
        '204': { description: All marked read }
  /imports/contacts:
    post:
      tags: [Imports]
      operationId: importContacts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /imports/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Imports]
      operationId: getImportJob
      responses:
        '200':
          description: Job progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '404': { $ref: '#/components/responses/NotFound' }
  /imports/{id}/errors:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Imports]
      operationId: getImportErrors
      responses:
        '200':
          description: Error report CSV
          content:
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /webhooks/leads/{publicKey}:
    post:
      tags: [Webhooks]
      operationId: receiveLeadWebhook
      security: []
      parameters:
        - name: publicKey
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
        - name: X-Pulse-Signature
          in: header
          required: true
          schema: { type: string, example: 't=1760000000,v1=abc123' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookLeadPayload'
      responses:
        '202':
          description: Event accepted/duplicate
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string, format: uuid }
                  status: { type: string, example: RECEIVED }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Body too large }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /webhook-sources:
    get:
      tags: [Webhooks]
      operationId: listWebhookSources
      responses:
        '200':
          description: Sources (secrets hidden)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSource'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Webhooks]
      operationId: createWebhookSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSourceCreate'
      responses:
        '201':
          description: Source created; secret returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSourceCreated'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhook-sources/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Webhooks]
      operationId: updateWebhookSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSourceUpdate'
      responses:
        '200':
          description: Source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSource'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSource
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhook-sources/{id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      responses:
        '200':
          description: New secret returned once; old valid for grace period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSourceCreated'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: entity
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string }
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '403': { $ref: '#/components/responses/Forbidden' }
  /exports/contacts:
    get:
      tags: [Exports]
      operationId: exportContacts
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: ownerId
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: { type: string }
      responses:
        '200':
          description: CSV stream
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /exports/deals:
    get:
      tags: [Exports]
      operationId: exportDeals
      parameters:
        - name: pipelineId
          in: query
          schema: { type: string, format: uuid }
        - name: ownerId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DealStatus' }
      responses:
        '200':
          description: CSV stream
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /ai/deals/{id}/summary:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [AI]
      operationId: summarizeDeal
      responses:
        '200':
          description: SSE stream (meta/token/done/error)
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /ai/deals/{id}/follow-up-email:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [AI]
      operationId: draftFollowUpEmail
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tone: { type: string, enum: [friendly, formal, concise] }
                language: { type: string, example: vi }
      responses:
        '200':
          description: Draft only; not sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiDraft'
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /ai/contacts/{id}/score:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [AI]
      operationId: scoreLead
      responses:
        '202':
          description: Score job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRunAccepted'
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /ai/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [AI]
      operationId: getAiRun
      responses:
        '200':
          description: AI run result/history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRun'
        '404': { $ref: '#/components/responses/NotFound' }
  /ai/usage:
    get:
      tags: [AI]
      operationId: getAiUsage
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Token/cost usage by role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsage'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required/invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Role/tenant not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found or other tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict/version/stage guard
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit or AI quota exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Dependency/provider unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        requestId: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          properties:
            database: { type: string }
            redis: { type: string }
    UserRole:
      type: string
      enum: [ADMIN, MANAGER, SALES]
    DealStatus:
      type: string
      enum: [OPEN, WON, LOST]
    ActivityType:
      type: string
      enum: [NOTE, CALL, EMAIL, TASK]
    NotificationType:
      type: string
      enum: [DEAL_ASSIGNED, DEAL_MOVED, TASK_DUE, TASK_OVERDUE, IMPORT_DONE, WEBHOOK_FAILED, AI_READY]
    RegisterRequest:
      type: object
      required: [orgName, name, email, password]
      properties:
        orgName: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: [string, 'null'] }
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 900 }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, orgId, email, name, role, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    UserList:
      type: object
      required: [data, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    UserCreate:
      type: object
      required: [email, name, password, role]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 12, maxLength: 128 }
        role: { $ref: '#/components/schemas/UserRole' }
    UserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: '#/components/schemas/UserRole' }
        active: { type: boolean }
    Contact:
      type: object
      required: [id, orgId, name, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        company: { type: [string, 'null'] }
        source: { type: [string, 'null'] }
        ownerId: { type: [string, 'null'], format: uuid }
        deletedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContactCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        company: { type: string, maxLength: 200 }
        source: { type: string, maxLength: 50 }
        ownerId: { type: string, format: uuid }
    ContactUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 30 }
        company: { type: [string, 'null'], maxLength: 200 }
        source: { type: [string, 'null'], maxLength: 50 }
    ContactList:
      type: object
      required: [data, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    Pipeline:
      type: object
      required: [id, orgId, name, stages]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }
    PipelineCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        stages:
          type: array
          items: { $ref: '#/components/schemas/StageCreate' }
    Stage:
      type: object
      required: [id, orgId, pipelineId, name, position, isWon, isLost]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        name: { type: string }
        position: { type: number }
        isWon: { type: boolean }
        isLost: { type: boolean }
    StageCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        position: { type: number }
        isWon: { type: boolean, default: false }
        isLost: { type: boolean, default: false }
    StageUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        position: { type: number }
        isWon: { type: boolean }
        isLost: { type: boolean }
    Deal:
      type: object
      required: [id, orgId, contactId, pipelineId, stageId, title, value, currency, ownerId, status, position, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        contactId: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        title: { type: string }
        value: { type: number }
        currency: { type: string, example: VND }
        ownerId: { type: string, format: uuid }
        expectedClose: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/DealStatus' }
        lostReason: { type: [string, 'null'] }
        position: { type: number }
        version: { type: integer }
        closedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DealCreate:
      type: object
      required: [contactId, pipelineId, stageId, title, value]
      properties:
        contactId: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        value: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        expectedClose: { type: string, format: date }
        ownerId: { type: string, format: uuid }
    DealUpdate:
      type: object
      required: [version]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        value: { type: number, minimum: 0 }
        expectedClose: { type: [string, 'null'], format: date }
        version: { type: integer }
    DealMove:
      type: object
      required: [stageId, position, version]
      properties:
        stageId: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        version: { type: integer }
        lostReason: { type: string, maxLength: 500 }
    DealAssign:
      type: object
      required: [ownerId, version]
      properties:
        ownerId: { type: string, format: uuid }
        version: { type: integer }
    DealList:
      type: object
      required: [data, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Deal' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    Activity:
      type: object
      required: [id, orgId, dealId, type, content, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        dealId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ActivityType' }
        content: { type: string }
        dueAt: { type: [string, 'null'], format: date-time }
        doneAt: { type: [string, 'null'], format: date-time }
        assigneeId: { type: [string, 'null'], format: uuid }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ActivityCreate:
      type: object
      required: [type, content]
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        content: { type: string, minLength: 1, maxLength: 10000 }
        dueAt: { type: string, format: date-time }
        assigneeId: { type: string, format: uuid }
    ActivityUpdate:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 10000 }
        dueAt: { type: [string, 'null'], format: date-time }
        assigneeId: { type: [string, 'null'], format: uuid }
    ActivityList:
      type: object
      required: [data, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    TaskUpdate:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 10000 }
        dueAt: { type: string, format: date-time }
        assigneeId: { type: string, format: uuid }
        done: { type: boolean }
    Notification:
      type: object
      required: [id, orgId, userId, type, payload, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        payload: { type: object, additionalProperties: true }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [data, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    ImportJob:
      type: object
      required: [id, orgId, status, total, success, failed, fileName, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, PARTIAL, FAILED] }
        total: { type: integer }
        success: { type: integer }
        failed: { type: integer }
        progress: { type: number, minimum: 0, maximum: 100 }
        fileName: { type: string }
        errorReportUrl: { type: [string, 'null'], format: uri }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    WebhookLeadPayload:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        company: { type: string, maxLength: 200 }
        source: { type: string, maxLength: 50 }
    WebhookSource:
      type: object
      required: [id, orgId, name, publicKey, secretLast4, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        publicKey: { type: string }
        secretLast4: { type: string }
        defaultOwnerId: { type: [string, 'null'], format: uuid }
        active: { type: boolean }
        rotatedAt: { type: [string, 'null'], format: date-time }
        secretGraceEndsAt: { type: [string, 'null'], format: date-time, description: Old secret accepted until this time after rotation }
        createdAt: { type: string, format: date-time }
    WebhookSourceCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        defaultOwnerId: { type: string, format: uuid }
    WebhookSourceCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookSource'
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: Returned only once }
    WebhookSourceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        defaultOwnerId: { type: [string, 'null'], format: uuid }
        active: { type: boolean }
    AuditLog:
      type: object
      required: [id, orgId, entity, entityId, action, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string, format: uuid }
        actorId: { type: [string, 'null'], format: uuid }
        entity: { type: string }
        entityId: { type: string }
        action: { type: string }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        requestId: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AuditLogList:
      type: object
      required: [data, hasMore]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    ReportSummary:
      type: object
      required: [range, newLeads, dealsByStage, pipelineValue, winRate, forecastByMonth, generatedAt]
      properties:
        range:
          type: object
          required: [from, to, timezone]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            timezone: { type: string }
        newLeads: { type: integer }
        dealsByStage:
          type: array
          items:
            type: object
            required: [stageId, stageName, count, value]
            properties:
              stageId: { type: string, format: uuid }
              stageName: { type: string }
              count: { type: integer }
              value: { type: number }
        pipelineValue: { type: number }
        winRate: { type: number, minimum: 0, maximum: 1 }
        forecastByMonth:
          type: array
          items:
            type: object
            required: [month, value]
            properties:
              month: { type: string, example: '2026-11' }
              value: { type: number }
        generatedAt: { type: string, format: date-time }
        cached: { type: boolean }
    AiDraft:
      type: object
      required: [subject, body, tone, language]
      properties:
        subject: { type: string }
        body: { type: string }
        tone: { type: string }
        language: { type: string }
    AiRunAccepted:
      type: object
      required: [runId, status]
      properties:
        runId: { type: string, format: uuid }
        status: { type: string, example: PENDING }
    AiRun:
      type: object
      required: [id, feature, entityType, entityId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        feature: { type: string, enum: [DEAL_SUMMARY, EMAIL_DRAFT, LEAD_SCORE, RAG_QA] }
        entityType: { type: string, enum: [DEAL, CONTACT] }
        entityId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PROCESSING, SUCCESS, ERROR, TIMEOUT, CACHED] }
        result:
          type: [object, 'null']
          additionalProperties: true
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AiUsage:
      type: object
      required: [from, to, inputTokens, outputTokens, costUsd, byFeature]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        costUsd: { type: number }
        byFeature:
          type: array
          items:
            type: object
            properties:
              feature: { type: string }
              inputTokens: { type: integer }
              outputTokens: { type: integer }
              costUsd: { type: number }
              cacheHits: { type: integer }
